<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>偃武九州积分计算器</title>
  <style>
    :root {
      --paper: #f7f1e4;
      --paper-soft: #fbf7ee;
      --ink: #302d28;
      --ink-soft: #6d675e;
      --ink-faint: rgba(57, 53, 47, 0.16);
      --line: rgba(72, 67, 59, 0.24);
      --silver: #dfe5e7;
      --silver-deep: #aebbc0;
      --star: rgba(236, 244, 247, 0.92);
      --accent: #7f8f93;
      --danger: #8f5d51;
      --radius: 14px;
      --shadow: 0 18px 60px rgba(67, 58, 42, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--paper);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "Noto Serif SC", "Songti SC", "SimSun", "STSong", serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.78) 0 1px, transparent 1.8px),
        radial-gradient(circle at 76% 18%, rgba(255, 255, 255, 0.58) 0 1px, transparent 1.8px),
        radial-gradient(circle at 42% 74%, rgba(255, 255, 255, 0.54) 0 1px, transparent 1.7px),
        radial-gradient(circle at 84% 72%, rgba(223, 229, 231, 0.55) 0 1px, transparent 1.7px),
        linear-gradient(105deg, rgba(103, 88, 65, 0.035) 0 1px, transparent 1px 18px),
        linear-gradient(0deg, rgba(255, 255, 255, 0.38), rgba(255, 255, 255, 0.08)),
        var(--paper);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: auto 0 0;
      height: 42vh;
      pointer-events: none;
      background:
        linear-gradient(to top, rgba(74, 70, 63, 0.10), transparent 72%),
        radial-gradient(80% 55% at 12% 100%, rgba(58, 55, 50, 0.13) 0 28%, transparent 29%),
        radial-gradient(72% 52% at 42% 100%, rgba(58, 55, 50, 0.10) 0 30%, transparent 31%),
        radial-gradient(70% 48% at 78% 100%, rgba(58, 55, 50, 0.12) 0 29%, transparent 30%),
        linear-gradient(to top, rgba(66, 62, 56, 0.12) 0 16%, transparent 16%);
      filter: blur(0.2px);
      opacity: 0.55;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(90deg, rgba(99, 89, 70, 0.022) 0 1px, transparent 1px 12px),
        repeating-linear-gradient(0deg, rgba(99, 89, 70, 0.018) 0 1px, transparent 1px 16px);
      mix-blend-mode: multiply;
      z-index: 0;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .star {
      position: absolute;
      width: var(--s);
      height: var(--s);
      left: var(--x);
      top: var(--y);
      border-radius: 999px;
      background: var(--star);
      box-shadow: 0 0 calc(var(--s) * 3) rgba(215, 226, 231, 0.95);
      opacity: var(--o);
      animation: twinkle var(--d) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    .star::after {
      content: "";
      position: absolute;
      inset: -170%;
      background:
        linear-gradient(90deg, transparent 44%, rgba(232, 241, 244, 0.55) 48% 52%, transparent 56%),
        linear-gradient(0deg, transparent 44%, rgba(232, 241, 244, 0.45) 48% 52%, transparent 56%);
      opacity: 0.32;
    }

    @keyframes twinkle {
      0%, 100% { transform: scale(0.9); opacity: calc(var(--o) * 0.62); }
      50% { transform: scale(1.18); opacity: var(--o); }
    }

    @media (prefers-reduced-motion: reduce) {
      .star {
        animation: none;
      }
    }

    .page {
      position: relative;
      z-index: 2;
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 22px 16px 42px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 28px;
    }

    .brand-mark {
      position: relative;
      padding-left: 2px;
      color: #3d3a34;
      font-family: "STKaiti", "KaiTi", "Kaiti SC", serif;
      font-size: clamp(28px, 6vw, 46px);
      font-weight: 500;
      letter-spacing: 0;
      text-shadow:
        0 0 6px rgba(238, 246, 249, 0.98),
        0 0 18px rgba(201, 216, 221, 0.72),
        0 1px 0 rgba(255, 255, 255, 0.76);
      white-space: nowrap;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      right: -18px;
      top: 9px;
      width: 12px;
      height: 12px;
      background:
        linear-gradient(90deg, transparent 0 44%, rgba(222, 233, 237, 0.95) 44% 56%, transparent 56%),
        linear-gradient(0deg, transparent 0 44%, rgba(222, 233, 237, 0.95) 44% 56%, transparent 56%);
      filter: drop-shadow(0 0 8px rgba(216, 229, 234, 0.95));
      opacity: 0.92;
    }

    .brand-sub {
      margin: 0;
      color: var(--ink-soft);
      font-size: 14px;
      text-align: right;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 22px;
      align-items: end;
      padding: 22px 0 24px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-family: "STKaiti", "KaiTi", "Kaiti SC", serif;
      font-size: clamp(32px, 8vw, 64px);
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1.08;
    }

    .hero-note {
      margin: 12px 0 0;
      color: var(--ink-soft);
      font-size: 15px;
      line-height: 1.8;
      max-width: 720px;
    }

    .astro {
      width: min(220px, 26vw);
      min-width: 120px;
      aspect-ratio: 1;
      opacity: 0.82;
    }

    .astro circle,
    .astro path,
    .astro line {
      fill: none;
      stroke: rgba(70, 76, 75, 0.34);
      stroke-width: 1;
    }

    .astro .node {
      fill: rgba(224, 232, 234, 0.92);
      stroke: rgba(114, 125, 127, 0.62);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(320px, 0.92fr);
      gap: 20px;
      margin-top: 22px;
      align-items: start;
    }

    .panel {
      position: relative;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.36), rgba(255, 255, 255, 0.10)),
        rgba(251, 247, 238, 0.82);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(2px);
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(72, 67, 59, 0.10);
      border-radius: calc(var(--radius) - 6px);
      pointer-events: none;
    }

    .panel-inner {
      position: relative;
      padding: 18px;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--ink-faint);
    }

    h2 {
      margin: 0;
      color: #35312b;
      font-size: 19px;
      font-weight: 500;
    }

    .small-note {
      color: var(--ink-soft);
      font-size: 13px;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .grid-four {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      min-width: 0;
    }

    label {
      display: block;
      margin: 0 0 6px;
      color: var(--ink-soft);
      font-size: 14px;
    }

    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid rgba(72, 67, 59, 0.26);
      border-radius: 10px;
      background: rgba(255, 252, 244, 0.72);
      color: var(--ink);
      padding: 10px 11px;
      font: 500 16px/1.25 "Noto Serif SC", "Songti SC", "SimSun", serif;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    input:focus {
      border-color: rgba(127, 143, 147, 0.74);
      box-shadow: 0 0 0 3px rgba(217, 228, 231, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    input::placeholder {
      color: rgba(109, 103, 94, 0.54);
    }

    .stack {
      display: grid;
      gap: 16px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
      align-items: center;
    }

    button {
      min-height: 44px;
      border: 1px solid rgba(141, 153, 157, 0.46);
      border-radius: 999px;
      background:
        radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.96), rgba(224, 232, 235, 0.72) 42%, rgba(199, 210, 215, 0.42)),
        #edf2f3;
      color: #313735;
      padding: 10px 18px;
      font: 500 15px/1 "Noto Serif SC", "Songti SC", "SimSun", serif;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(89, 102, 105, 0.13), inset 0 1px 0 rgba(255, 255, 255, 0.72);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(141, 153, 157, 0.76);
      box-shadow: 0 0 0 3px rgba(232, 241, 244, 0.72), 0 10px 28px rgba(89, 102, 105, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.78);
    }

    button:active {
      transform: translateY(0);
    }

    .secondary-btn {
      background: rgba(255, 252, 244, 0.62);
      color: var(--ink-soft);
    }

    .status {
      color: var(--ink-soft);
      font-size: 13px;
      min-height: 1.4em;
    }

    .result-card {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .metric {
      padding: 13px 12px;
      border: 1px solid rgba(72, 67, 59, 0.16);
      border-radius: 12px;
      background: rgba(255, 252, 244, 0.58);
    }

    .metric span {
      display: block;
      color: var(--ink-soft);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .metric strong {
      display: block;
      color: #292621;
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 500;
      word-break: break-word;
    }

    .subtle {
      margin-top: 6px;
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.5;
    }

    .plan-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .plan-item {
      padding: 12px;
      border-top: 1px solid var(--ink-faint);
      border-bottom: 1px solid var(--ink-faint);
      background: rgba(255, 255, 255, 0.13);
    }

    .plan-item span {
      display: block;
      color: var(--ink-soft);
      font-size: 13px;
    }

    .plan-item strong {
      display: block;
      margin-top: 4px;
      font-size: 20px;
      font-weight: 500;
    }

    .section {
      margin-top: 18px;
    }

    .section h3 {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 500;
      color: #35312b;
    }

    .bars {
      display: grid;
      gap: 9px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr) 86px;
      gap: 9px;
      align-items: center;
      color: var(--ink-soft);
      font-size: 13px;
    }

    .bar-track {
      height: 8px;
      border-radius: 999px;
      background: rgba(81, 77, 69, 0.10);
      overflow: hidden;
    }

    .bar-fill {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(166, 178, 181, 0.72), rgba(230, 238, 240, 0.95));
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      padding: 9px 6px;
      border-bottom: 1px solid rgba(72, 67, 59, 0.13);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--ink-soft);
      font-weight: 500;
      white-space: nowrap;
    }

    td.num,
    th.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .empty {
      padding: 18px;
      color: var(--ink-soft);
      border-top: 1px solid var(--ink-faint);
      border-bottom: 1px solid var(--ink-faint);
      background: rgba(255, 255, 255, 0.14);
      line-height: 1.7;
    }

    .footer-note {
      margin: 20px 0 0;
      color: rgba(109, 103, 94, 0.78);
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
    }

    @media (max-width: 860px) {
      .layout,
      .hero {
        grid-template-columns: 1fr;
      }

      .astro {
        width: 150px;
        justify-self: end;
        margin-top: -14px;
      }

      .grid-four,
      .result-card,
      .plan-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 540px) {
      .page {
        padding: 16px 12px 30px;
      }

      .brand {
        align-items: flex-start;
        margin-bottom: 18px;
      }

      .brand-sub {
        display: none;
      }

      .hero {
        padding: 18px 0;
      }

      .panel-inner {
        padding: 15px;
      }

      .grid,
      .grid-four {
        grid-template-columns: 1fr;
      }

      .result-card,
      .plan-list {
        grid-template-columns: 1fr 1fr;
      }

      .bar-row {
        grid-template-columns: 42px minmax(0, 1fr);
      }

      .bar-row .num {
        grid-column: 2;
        text-align: left;
      }

      button {
        flex: 1 1 130px;
      }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars" aria-hidden="true"></div>

  <main class="page">
    <header class="brand">
      <div class="brand-mark">群星之辉</div>
      <p class="brand-sub">联盟星谱 · 偃武九州</p>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">偃武九州积分计算器</h1>
        <p class="hero-note">输入当前资源、加速、马卷与自选资源宝箱数量，计算可获得积分最高的训练方案。</p>
      </div>
      <svg class="astro" viewBox="0 0 220 220" role="img" aria-label="群星星谱纹样">
        <circle cx="110" cy="110" r="86"></circle>
        <circle cx="110" cy="110" r="55"></circle>
        <path d="M34 112 C70 76, 112 60, 184 48"></path>
        <path d="M46 160 C82 130, 125 122, 182 146"></path>
        <path d="M76 32 L92 86 L142 58 L128 116 L178 122 L132 144 L150 190 L106 154 L58 180 L82 132 L36 100 L88 98 Z"></path>
        <line x1="70" y1="74" x2="118" y2="64"></line>
        <line x1="118" y1="64" x2="154" y2="108"></line>
        <line x1="154" y1="108" x2="126" y2="150"></line>
        <line x1="126" y1="150" x2="78" y2="136"></line>
        <circle class="node" cx="70" cy="74" r="3.8"></circle>
        <circle class="node" cx="118" cy="64" r="4.2"></circle>
        <circle class="node" cx="154" cy="108" r="3.6"></circle>
        <circle class="node" cx="126" cy="150" r="4.4"></circle>
        <circle class="node" cx="78" cy="136" r="3.4"></circle>
      </svg>
    </section>

    <div class="layout">
      <section class="stack" aria-label="输入区域">
        <div class="panel">
          <div class="panel-inner">
            <div class="panel-title">
              <h2>现有资源</h2>
              <span class="small-note">单位：万</span>
            </div>
            <div class="grid-four">
              <div class="field">
                <label for="res-food">粮食</label>
                <input id="res-food" type="number" min="0" step="0.1" inputmode="decimal" placeholder="0">
              </div>
              <div class="field">
                <label for="res-wood">木材</label>
                <input id="res-wood" type="number" min="0" step="0.1" inputmode="decimal" placeholder="0">
              </div>
              <div class="field">
                <label for="res-stone">石料</label>
                <input id="res-stone" type="number" min="0" step="0.1" inputmode="decimal" placeholder="0">
              </div>
              <div class="field">
                <label for="res-iron">铁矿</label>
                <input id="res-iron" type="number" min="0" step="0.1" inputmode="decimal" placeholder="0">
              </div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-inner">
            <div class="panel-title">
              <h2>加速与马卷</h2>
              <span class="small-note">加速按总时长计算</span>
            </div>
            <div class="grid-four">
              <div class="field">
                <label for="speed-days">天</label>
                <input id="speed-days" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
              </div>
              <div class="field">
                <label for="speed-hours">小时</label>
                <input id="speed-hours" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
              </div>
              <div class="field">
                <label for="speed-minutes">分钟</label>
                <input id="speed-minutes" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
              </div>
              <div class="field">
                <label for="horse-scrolls">马卷</label>
                <input id="horse-scrolls" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
              </div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-inner">
            <div class="panel-title">
              <h2>自选资源宝箱</h2>
              <span class="small-note">每个宝箱四选一</span>
            </div>
            <div class="grid">
              <div class="field">
                <label for="box-a">中品自选资源宝箱</label>
                <input id="box-a" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
              </div>
              <div class="field">
                <label for="box-b">良品自选资源宝箱</label>
                <input id="box-b" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
              </div>
              <div class="field">
                <label for="box-c">上品自选资源宝箱</label>
                <input id="box-c" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
              </div>
              <div class="field">
                <label for="box-d">珍品自选资源宝箱</label>
                <input id="box-d" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
              </div>
            </div>
            <div class="actions">
              <button id="calculate" type="button">星算最高积分</button>
              <button id="reset" class="secondary-btn" type="button">重置</button>
              <span id="status" class="status" aria-live="polite"></span>
            </div>
          </div>
        </div>
      </section>

      <section class="panel" aria-label="计算结果">
        <div class="panel-inner">
          <div class="panel-title">
            <h2>星谱结果</h2>
            <span class="small-note" id="rank-rule">积分优先</span>
          </div>

          <div id="empty" class="empty">尚未计算。</div>

          <div id="result" hidden>
            <div class="result-card">
              <div class="metric">
                <span>最高积分</span>
                <strong id="best-score">0</strong>
                <div class="subtle" id="best-types">0种训练</div>
              </div>
              <div class="metric">
                <span>加速消耗</span>
                <strong id="best-time">0分钟</strong>
                <div class="subtle" id="best-scrolls">马卷0张</div>
              </div>
              <div class="metric">
                <span>铁置换</span>
                <strong id="best-convert">0万</strong>
                <div class="subtle" id="convert-note">无需置换</div>
              </div>
            </div>

            <div class="section">
              <h3>训练方案</h3>
              <div class="plan-list" id="training-plan"></div>
            </div>

            <div class="section">
              <h3>资源消耗</h3>
              <div class="bars" id="resource-bars"></div>
            </div>

            <div class="section">
              <h3>宝箱选择</h3>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>宝箱</th>
                      <th class="num">粮</th>
                      <th class="num">木</th>
                      <th class="num">石</th>
                      <th class="num">铁</th>
                      <th class="num">未用</th>
                    </tr>
                  </thead>
                  <tbody id="box-plan"></tbody>
                </table>
              </div>
            </div>

            <div class="section">
              <h3>铁置换去向</h3>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>去向</th>
                      <th class="num">粮食</th>
                      <th class="num">木材</th>
                      <th class="num">石料</th>
                    </tr>
                  </thead>
                  <tbody id="conversion-plan"></tbody>
                </table>
              </div>
            </div>

            <div class="section">
              <h3>同分候选</h3>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>积分</th>
                      <th class="num">T3</th>
                      <th class="num">T4</th>
                      <th class="num">T5</th>
                      <th class="num">训马</th>
                      <th class="num">类型</th>
                      <th class="num">置换</th>
                    </tr>
                  </thead>
                  <tbody id="alternatives"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <p class="footer-note">资源输入单位为万；兵种训练按每次8000兵计算。</p>
  </main>

  <script>
    (function () {
      "use strict";

      var resources = ["food", "wood", "stone", "iron"];
      var labels = { food: "粮食", wood: "木材", stone: "石料", iron: "铁矿" };
      var boxLabels = {
        A: "中品",
        B: "良品",
        C: "上品",
        D: "珍品"
      };
      var boxFullLabels = {
        A: "中品自选资源宝箱",
        B: "良品自选资源宝箱",
        C: "上品自选资源宝箱",
        D: "珍品自选资源宝箱"
      };
      var types = {
        t3: { label: "T3兵", points: 16000, time: 59276, res: { food: 960, wood: 960, stone: 720, iron: 96 } },
        t4: { label: "T4兵", points: 32000, time: 98794, res: { food: 1920, wood: 1920, stone: 1440, iron: 192 } },
        t5: { label: "T5兵", points: 72000, time: 157952, res: { food: 5040, wood: 5040, stone: 3840, iron: 3840 } },
        horse: { label: "训马", points: 200000, time: 432000, res: { food: 15000, wood: 15000, stone: 11250, iron: 7500 } }
      };
      var boxes = {
        A: { base: 100, vals: { food: 100, wood: 100, stone: 75, iron: 30 } },
        B: { base: 500, vals: { food: 500, wood: 500, stone: 375, iron: 150 } },
        C: { base: 2000, vals: { food: 2000, wood: 2000, stone: 1500, iron: 700 } },
        D: { base: 6000, vals: { food: 6000, wood: 6000, stone: 4500, iron: 2400 } }
      };
      var inputIds = ["res-food", "res-wood", "res-stone", "res-iron", "speed-days", "speed-hours", "speed-minutes", "horse-scrolls", "box-a", "box-b", "box-c", "box-d"];
      var boxOrder = ["D", "C", "B", "A"];
      var boxOrderSmall = ["A", "B", "C", "D"];
      var activeJob = 0;
      var resPerms = [
        ["food", "wood", "stone"],
        ["food", "stone", "wood"],
        ["wood", "food", "stone"],
        ["wood", "stone", "food"],
        ["stone", "food", "wood"],
        ["stone", "wood", "food"]
      ];

      function el(id) {
        return document.getElementById(id);
      }

      function makeStars() {
        var host = el("stars");
        var count = Math.min(150, Math.max(95, Math.floor(window.innerWidth / 8)));
        var html = "";
        for (var i = 0; i < count; i += 1) {
          var size = (Math.random() * 1.8 + 0.8).toFixed(2) + "px";
          html += '<i class="star" style="--x:' + (Math.random() * 100).toFixed(2) + "%;--y:" + (Math.random() * 100).toFixed(2) + "%;--s:" + size + ";--o:" + (Math.random() * 0.45 + 0.25).toFixed(2) + ";--d:" + (Math.random() * 3 + 3).toFixed(2) + "s;--delay:-" + (Math.random() * 4).toFixed(2) + 's"></i>';
        }
        host.innerHTML = html;
      }

      function readNumber(id) {
        var value = Number(el(id).value);
        return Number.isFinite(value) && value > 0 ? value : 0;
      }

      function readState() {
        return {
          base: {
            food: Math.round(readNumber("res-food") * 10),
            wood: Math.round(readNumber("res-wood") * 10),
            stone: Math.round(readNumber("res-stone") * 10),
            iron: Math.round(readNumber("res-iron") * 10)
          },
          speed: Math.floor(readNumber("speed-days")) * 86400 + Math.floor(readNumber("speed-hours")) * 3600 + Math.floor(readNumber("speed-minutes")) * 60,
          scrolls: Math.floor(readNumber("horse-scrolls")),
          boxCounts: {
            A: Math.floor(readNumber("box-a")),
            B: Math.floor(readNumber("box-b")),
            C: Math.floor(readNumber("box-c")),
            D: Math.floor(readNumber("box-d"))
          }
        };
      }

      function cloneCounts(counts) {
        return { A: counts.A, B: counts.B, C: counts.C, D: counts.D };
      }

      function emptyBoxAlloc() {
        return {
          A: { food: 0, wood: 0, stone: 0, iron: 0 },
          B: { food: 0, wood: 0, stone: 0, iron: 0 },
          C: { food: 0, wood: 0, stone: 0, iron: 0 },
          D: { food: 0, wood: 0, stone: 0, iron: 0 }
        };
      }

      function demandFor(horse, t5, y) {
        var t4 = Math.floor(y / 2);
        var t3 = y % 2;
        var demand = { food: 0, wood: 0, stone: 0, iron: 0 };
        resources.forEach(function (r) {
          demand[r] = horse * types.horse.res[r] + t5 * types.t5.res[r] + t4 * types.t4.res[r] + t3 * types.t3.res[r];
        });
        return {
          counts: { t3: t3, t4: t4, t5: t5, horse: horse },
          demand: demand,
          time: horse * types.horse.time + t5 * types.t5.time + t4 * types.t4.time + t3 * types.t3.time,
          points: horse * types.horse.points + t5 * types.t5.points + t4 * types.t4.points + t3 * types.t3.points
        };
      }

      function typeCount(counts) {
        return ["t3", "t4", "t5", "horse"].reduce(function (sum, key) {
          return sum + (counts[key] > 0 ? 1 : 0);
        }, 0);
      }

      function weightedNeed(defs) {
        return Math.max(0, defs.food) + Math.max(0, defs.wood) + Math.ceil(Math.max(0, defs.stone) * 4 / 3);
      }

      function currentIron(current) {
        return ["A", "B", "C", "D"].reduce(function (sum, b) {
          return sum + current[b] * boxes[b].vals.iron;
        }, 0);
      }

      function ironCandidateAllocations(counts, ironNeed, extraNeed) {
        var targets = {};
        var baseTarget = Math.max(0, Math.ceil(ironNeed));
        [baseTarget, baseTarget + 30, baseTarget + 150, baseTarget + 700, baseTarget + 2400, baseTarget + Math.ceil(extraNeed / 4), baseTarget + Math.ceil(extraNeed / 2), baseTarget + Math.ceil(extraNeed)].forEach(function (t) {
          targets[Math.max(0, t)] = true;
        });

        var candidates = [];
        var seen = {};

        function optionWindow(center, max, spread) {
          var options = {};
          var n;
          function add(raw) {
            var v = Math.max(0, Math.min(max, raw));
            options[v] = true;
          }
          add(0);
          add(max);
          for (n = center - spread; n <= center + spread; n += 1) add(n);
          if (max <= spread * 2 + 3) {
            for (n = 0; n <= max; n += 1) add(n);
          }
          return Object.keys(options).map(Number).sort(function (a, b) { return a - b; });
        }

        function pushCandidate(target, alloc) {
          var iron = currentIron(alloc);
          if (iron < target) return;
          var key = ["A", "B", "C", "D"].map(function (b) { return alloc[b]; }).join(",");
          if (seen[key]) return;
          seen[key] = true;
          var loss = ["A", "B", "C", "D"].reduce(function (sum, b) {
            return sum + alloc[b] * boxes[b].base;
          }, 0);
          candidates.push({ alloc: { A: alloc.A, B: alloc.B, C: alloc.C, D: alloc.D }, iron: iron, loss: loss });
        }

        Object.keys(targets).map(Number).forEach(function (target) {
          var dCenter = Math.ceil(target / boxes.D.vals.iron);
          optionWindow(dCenter, counts.D, 2).forEach(function (d) {
            var restAfterD = Math.max(0, target - d * boxes.D.vals.iron);
            var cCenter = Math.ceil(restAfterD / boxes.C.vals.iron);
            optionWindow(cCenter, counts.C, 2).forEach(function (c) {
              var restAfterC = Math.max(0, restAfterD - c * boxes.C.vals.iron);
              var bCenter = Math.ceil(restAfterC / boxes.B.vals.iron);
              optionWindow(bCenter, counts.B, 2).forEach(function (b) {
                var restAfterB = Math.max(0, restAfterC - b * boxes.B.vals.iron);
                var a = Math.min(counts.A, Math.ceil(restAfterB / boxes.A.vals.iron));
                pushCandidate(target, { A: a, B: b, C: c, D: d });
              });
            });
          });
        });

        return candidates.sort(function (a, b) {
          return a.loss - b.loss || a.iron - b.iron;
        }).slice(0, 18);
      }

      function addAlloc(target, source) {
        Object.keys(target).forEach(function (b) {
          resources.forEach(function (r) {
            target[b][r] += source[b][r];
          });
        });
      }

      function totalUnusedBoxes(counts) {
        return ["A", "B", "C", "D"].reduce(function (sum, b) {
          return sum + counts[b];
        }, 0);
      }

      function resourceFirstAttempt(counts, startDefs, order, perm) {
        var left = cloneCounts(counts);
        var defs = { food: startDefs.food, wood: startDefs.wood, stone: startDefs.stone };
        var alloc = emptyBoxAlloc();
        perm.forEach(function (r) {
          order.forEach(function (b) {
            if (left[b] <= 0 || defs[r] <= 0) return;
            var value = boxes[b].vals[r];
            var use = Math.min(left[b], Math.ceil(defs[r] / value));
            if (use > 0) {
              left[b] -= use;
              alloc[b][r] += use;
              defs[r] = Math.max(0, defs[r] - use * value);
            }
          });
        });
        return { left: left, defs: defs, alloc: alloc };
      }

      function typeFirstAttempt(counts, startDefs, order, perm) {
        var left = cloneCounts(counts);
        var defs = { food: startDefs.food, wood: startDefs.wood, stone: startDefs.stone };
        var alloc = emptyBoxAlloc();
        order.forEach(function (b) {
          while (left[b] > 0 && weightedNeed(defs) > 0) {
            var ranked = perm.map(function (r) {
              return { r: r, need: r === "stone" ? Math.ceil(defs[r] * 4 / 3) : defs[r] };
            }).sort(function (a, c) {
              return c.need - a.need;
            });
            var r = ranked[0].r;
            if (defs[r] <= 0) break;
            var value = boxes[b].vals[r];
            var use = Math.min(left[b], Math.max(1, Math.ceil(defs[r] / value)));
            left[b] -= use;
            alloc[b][r] += use;
            defs[r] = Math.max(0, defs[r] - use * value);
          }
        });
        return { left: left, defs: defs, alloc: alloc };
      }

      function allocateDirect(remainingCounts, deficits, ironSurplus) {
        var attempts = [];
        [boxOrder, boxOrderSmall].forEach(function (order) {
          resPerms.forEach(function (perm) { attempts.push(resourceFirstAttempt(remainingCounts, deficits, order, perm)); });
          resPerms.forEach(function (perm) { attempts.push(typeFirstAttempt(remainingCounts, deficits, order, perm)); });
        });

        var best = null;
        attempts.forEach(function (attempt) {
          var need = weightedNeed(attempt.defs);
          if (need <= ironSurplus + 0.0001) {
            var score = need + totalUnusedBoxes(attempt.left) * 0.000001;
            if (!best || score < best.score) best = Object.assign({ need: need, score: score }, attempt);
          }
        });
        return best;
      }

      function conversionFromDefs(defs) {
        var food = Math.max(0, defs.food);
        var wood = Math.max(0, defs.wood);
        var stone = Math.ceil(Math.max(0, defs.stone) * 4 / 3);
        return { food: food, wood: wood, stone: stone, total: food + wood + stone };
      }

      function checkFeasible(state, demand) {
        var base = state.base;
        var startDefs = {
          food: Math.max(0, demand.food - base.food),
          wood: Math.max(0, demand.wood - base.wood),
          stone: Math.max(0, demand.stone - base.stone)
        };
        var ironNeed = Math.max(0, demand.iron - base.iron);
        var baseIronSurplus = Math.max(0, base.iron - demand.iron);
        var extraNeed = weightedNeed(startDefs);
        var ironCandidates = ironCandidateAllocations(state.boxCounts, ironNeed, extraNeed);
        var best = null;

        ironCandidates.forEach(function (cand) {
          var remaining = {};
          var ok = true;
          ["A", "B", "C", "D"].forEach(function (b) {
            remaining[b] = state.boxCounts[b] - cand.alloc[b];
            if (remaining[b] < 0) ok = false;
          });
          if (!ok) return;

          var ironSurplus = baseIronSurplus + cand.iron - ironNeed;
          if (ironSurplus < -0.0001) return;

          var direct = allocateDirect(remaining, startDefs, ironSurplus);
          if (!direct) return;

          var boxAlloc = emptyBoxAlloc();
          ["A", "B", "C", "D"].forEach(function (b) {
            boxAlloc[b].iron = cand.alloc[b];
          });
          addAlloc(boxAlloc, direct.alloc);

          var conversion = conversionFromDefs(direct.defs);
          var noConversion = conversion.total === 0;
          var usedBoxes = {};
          var unusedBoxes = {};
          ["A", "B", "C", "D"].forEach(function (b) {
            usedBoxes[b] = resources.reduce(function (sum, r) {
              return sum + boxAlloc[b][r];
            }, 0);
            unusedBoxes[b] = state.boxCounts[b] - usedBoxes[b];
          });

          var score = (noConversion ? 0 : 1000000000) + conversion.total + cand.loss * 0.001 + totalUnusedBoxes(unusedBoxes) * 0.000001;
          if (!best || score < best.score) {
            best = { feasible: true, boxAlloc: boxAlloc, conversion: conversion, noConversion: noConversion, unusedBoxes: unusedBoxes, score: score };
          }
        });

        return best || { feasible: false };
      }

      function maxYForTime(seconds) {
        if (seconds < types.t3.time) return 0;
        var y = Math.floor(seconds / types.t4.time) * 2;
        var rem = seconds - Math.floor(y / 2) * types.t4.time;
        if (rem >= types.t3.time) y += 1;
        return y;
      }

      function optimisticResourceTotals(state) {
        var maxDirect = { food: 0, wood: 0, stone: 0, iron: 0 };
        ["A", "B", "C", "D"].forEach(function (b) {
          resources.forEach(function (r) {
            maxDirect[r] += state.boxCounts[b] * boxes[b].vals[r];
          });
        });
        return {
          food: state.base.food + maxDirect.food + state.base.iron + maxDirect.iron,
          wood: state.base.wood + maxDirect.wood + state.base.iron + maxDirect.iron,
          stone: state.base.stone + maxDirect.stone + Math.floor((state.base.iron + maxDirect.iron) * 0.75),
          iron: state.base.iron + maxDirect.iron
        };
      }

      function compareCandidates(a, b) {
        if (a.points !== b.points) return b.points - a.points;
        if (a.typeCount !== b.typeCount) return a.typeCount - b.typeCount;
        if (a.noConversion !== b.noConversion) return a.noConversion ? -1 : 1;
        if (a.time !== b.time) return a.time - b.time;
        return a.conversion.total - b.conversion.total;
      }

      function insertCandidate(list, candidate) {
        list.push(candidate);
        list.sort(compareCandidates);
        var seen = {};
        var unique = [];
        list.forEach(function (item) {
          var key = [item.counts.t3, item.counts.t4, item.counts.t5, item.counts.horse].join("-");
          if (!seen[key]) {
            seen[key] = true;
            unique.push(item);
          }
        });
        return unique.slice(0, 12);
      }

      function yieldToBrowser() {
        return new Promise(function (resolve) {
          window.setTimeout(resolve, 0);
        });
      }

      async function optimize(state, jobId) {
        var total = optimisticResourceTotals(state);
        var maxHorse = Math.min(
          state.scrolls,
          Math.floor(state.speed / types.horse.time),
          Math.floor(total.food / types.horse.res.food),
          Math.floor(total.wood / types.horse.res.wood),
          Math.floor(total.stone / types.horse.res.stone),
          Math.floor(total.iron / types.horse.res.iron)
        );
        var bestList = [];
        var workTicks = 0;

        for (var horse = maxHorse; horse >= 0; horse -= 1) {
          if (jobId !== activeJob) return [];
          var timeAfterHorse = state.speed - horse * types.horse.time;
          if (timeAfterHorse < 0) continue;
          var maxT5 = Math.min(
            Math.floor(timeAfterHorse / types.t5.time),
            Math.floor(Math.max(0, total.food - horse * types.horse.res.food) / types.t5.res.food),
            Math.floor(Math.max(0, total.wood - horse * types.horse.res.wood) / types.t5.res.wood),
            Math.floor(Math.max(0, total.stone - horse * types.horse.res.stone) / types.t5.res.stone),
            Math.floor(Math.max(0, total.iron - horse * types.horse.res.iron) / types.t5.res.iron)
          );

          for (var t5 = maxT5; t5 >= 0; t5 -= 1) {
            workTicks += 1;
            if (workTicks % 16 === 0) {
              el("status").textContent = "星算中...已巡星 " + workTicks + " 步";
              await yieldToBrowser();
              if (jobId !== activeJob) return [];
            }
            var timeLeft = timeAfterHorse - t5 * types.t5.time;
            var high = maxYForTime(timeLeft);
            high = Math.min(
              high,
              Math.floor(Math.max(0, total.food - horse * types.horse.res.food - t5 * types.t5.res.food) / types.t3.res.food),
              Math.floor(Math.max(0, total.wood - horse * types.horse.res.wood - t5 * types.t5.res.wood) / types.t3.res.wood),
              Math.floor(Math.max(0, total.stone - horse * types.horse.res.stone - t5 * types.t5.res.stone) / types.t3.res.stone),
              Math.floor(Math.max(0, total.iron - horse * types.horse.res.iron - t5 * types.t5.res.iron) / types.t3.res.iron)
            );
            if (bestList.length && horse * types.horse.points + t5 * types.t5.points + high * types.t3.points < bestList[0].points) {
              continue;
            }

            var low = 0;
            var bestY = -1;
            var bestCheck = null;
            while (low <= high) {
              var mid = Math.floor((low + high) / 2);
              var plan = demandFor(horse, t5, mid);
              var check = checkFeasible(state, plan.demand);
              if (check.feasible && plan.time <= state.speed) {
                bestY = mid;
                bestCheck = check;
                low = mid + 1;
              } else {
                high = mid - 1;
              }
            }

            [bestY, bestY - 1, bestY - 2, bestY + 1].forEach(function (y) {
              if (y < 0) return;
              var plan = demandFor(horse, t5, y);
              if (plan.time > state.speed) return;
              var check = y === bestY && bestCheck ? bestCheck : checkFeasible(state, plan.demand);
              if (!check.feasible) return;
              bestList = insertCandidate(bestList, {
                counts: plan.counts,
                demand: plan.demand,
                time: plan.time,
                points: plan.points,
                typeCount: typeCount(plan.counts),
                noConversion: check.noConversion,
                conversion: check.conversion,
                boxAlloc: check.boxAlloc,
                unusedBoxes: check.unusedBoxes
              });
            });
          }
        }

        return bestList;
      }

      function formatWan(units) {
        var value = units / 10;
        if (Math.abs(value - Math.round(value)) < 0.0001) return String(Math.round(value)) + "万";
        return value.toFixed(1).replace(/\.0$/, "") + "万";
      }

      function formatScore(value) {
        return new Intl.NumberFormat("zh-CN").format(value);
      }

      function formatTime(seconds) {
        var rest = Math.max(0, Math.floor(seconds));
        var d = Math.floor(rest / 86400);
        rest -= d * 86400;
        var h = Math.floor(rest / 3600);
        rest -= h * 3600;
        var m = Math.floor(rest / 60);
        var parts = [];
        if (d) parts.push(d + "天");
        if (h) parts.push(h + "小时");
        if (m || parts.length === 0) parts.push(m + "分钟");
        return parts.join("");
      }

      function resourceUseFromPlan(plan) {
        var boxAdds = { food: 0, wood: 0, stone: 0, iron: 0 };
        ["A", "B", "C", "D"].forEach(function (b) {
          resources.forEach(function (r) {
            boxAdds[r] += plan.boxAlloc[b][r] * boxes[b].vals[r];
          });
        });
        return boxAdds;
      }

      function renderBars(state, plan) {
        var totals = {
          food: state.base.food,
          wood: state.base.wood,
          stone: state.base.stone,
          iron: state.base.iron
        };
        var boxAdds = resourceUseFromPlan(plan);
        resources.forEach(function (r) {
          totals[r] += boxAdds[r];
        });
        totals.food += plan.conversion.food;
        totals.wood += plan.conversion.wood;
        totals.stone += Math.floor(plan.conversion.stone * 0.75);
        totals.iron -= plan.conversion.total;

        el("resource-bars").innerHTML = resources.map(function (r) {
          var used = plan.demand[r];
          var totalValue = Math.max(used, totals[r], 1);
          var pct = Math.min(100, Math.round(used / totalValue * 100));
          return '<div class="bar-row"><span>' + labels[r] + '</span><span class="bar-track"><span class="bar-fill" style="width:' + pct + '%"></span></span><span class="num">' + formatWan(used) + '</span></div>';
        }).join("");
      }

      function render(bestList, state) {
        var empty = el("empty");
        var result = el("result");
        var status = el("status");

        if (!bestList.length) {
          empty.hidden = false;
          result.hidden = true;
          empty.textContent = "当前输入下没有可执行训练。";
          status.textContent = "未找到可执行方案。";
          return;
        }

        var best = bestList[0];
        empty.hidden = true;
        result.hidden = false;
        status.textContent = "已完成星算。";
        el("rank-rule").textContent = "同分少类型优先";
        el("best-score").textContent = formatScore(best.points);
        el("best-types").textContent = best.typeCount + "种训练类型";
        el("best-time").textContent = formatTime(best.time);
        el("best-scrolls").textContent = "马卷" + best.counts.horse + "张";
        el("best-convert").textContent = formatWan(best.conversion.total);
        el("convert-note").textContent = best.conversion.total === 0 ? "无需置换" : "粮木石按铁矿置换";

        el("training-plan").innerHTML = [
          ["T3兵", best.counts.t3],
          ["T4兵", best.counts.t4],
          ["T5兵", best.counts.t5],
          ["训马", best.counts.horse]
        ].map(function (item) {
          return '<div class="plan-item"><span>' + item[0] + '</span><strong>' + item[1] + '次</strong></div>';
        }).join("");

        renderBars(state, best);

        el("box-plan").innerHTML = ["A", "B", "C", "D"].map(function (b) {
          var a = best.boxAlloc[b];
          return "<tr><td>" + boxLabels[b] + "</td><td class=\"num\">" + a.food + "</td><td class=\"num\">" + a.wood + "</td><td class=\"num\">" + a.stone + "</td><td class=\"num\">" + a.iron + "</td><td class=\"num\">" + best.unusedBoxes[b] + "</td></tr>";
        }).join("");

        el("conversion-plan").innerHTML = "<tr><td>消耗铁矿</td><td class=\"num\">" + formatWan(best.conversion.food) + "</td><td class=\"num\">" + formatWan(best.conversion.wood) + "</td><td class=\"num\">" + formatWan(best.conversion.stone) + "</td></tr>";

        el("alternatives").innerHTML = bestList.slice(0, 8).map(function (item) {
          return "<tr><td>" + formatScore(item.points) + "</td><td class=\"num\">" + item.counts.t3 + "</td><td class=\"num\">" + item.counts.t4 + "</td><td class=\"num\">" + item.counts.t5 + "</td><td class=\"num\">" + item.counts.horse + "</td><td class=\"num\">" + item.typeCount + "</td><td class=\"num\">" + (item.conversion.total === 0 ? "无" : formatWan(item.conversion.total)) + "</td></tr>";
        }).join("");
      }

      function calculate() {
        var state = readState();
        var jobId = activeJob + 1;
        activeJob = jobId;
        el("status").textContent = "星算中...";
        window.setTimeout(function () {
          optimize(state, jobId).then(function (bestList) {
            if (jobId !== activeJob) return;
            render(bestList, state);
          }).catch(function () {
            if (jobId === activeJob) el("status").textContent = "计算中断，请减小输入后重试。";
          });
        }, 20);
      }

      function resetAll() {
        activeJob += 1;
        inputIds.forEach(function (id) {
          el(id).value = "";
        });
        el("result").hidden = true;
        el("empty").hidden = false;
        el("empty").textContent = "尚未计算。";
        el("status").textContent = "已重置。";
        el("rank-rule").textContent = "积分优先";
      }

      makeStars();
      el("calculate").addEventListener("click", calculate);
      el("reset").addEventListener("click", resetAll);
      inputIds.forEach(function (id) {
        el(id).addEventListener("change", calculate);
      });
    })();
  </script>
</body>
</html>

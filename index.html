<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>偃武登封积分最大化计算器</title>
<style>
/* ===== 阶段B：极简工具风 + 其徐如林团队标识 ===== */
/* 配色规范（固定色值，CSS 变量统一管理） */
:root {
  --color-main-darkgreen: #2C423B; /* 墨绿：标题、按钮主色 */
  --color-sub-bamboo: #547C6F;    /* 竹青：分割线、次要文字 */
  --color-bg-page: #f7f8f7;        /* 纸白：页面底色，带极淡墨绿调 */
  --color-bg-card: #ffffff;        /* 卡片纯白，呼应宣纸质感 */
  --color-highlight-gold: #A88C56; /* 仅用于最大总积分高亮 */
  --color-border-card: #dfe3e1;   /* 卡片边框细浅灰，偏墨绿调 */
  --color-text-main: #2C423B;      /* 主文字色 */
  --color-text-sub: #6b7280;       /* 次要文字 */
  --color-error: #c0392b;          /* 错误文字 */
  /* spacing 系统：统一间距节奏 */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 24px;
  /* 卡片极轻阴影（提升层次，不抢眼） */
  --shadow-card: 0 1px 3px rgba(44, 66, 59, 0.05), 0 1px 2px rgba(44, 66, 59, 0.03);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: var(--space-sm);
  /* 水墨径向渐变：中心纸白，边缘极淡墨绿，呼应红包水墨意境 */
  /* 仅用 CSS 渐变，无图片、无 SVG、无竹叶插画 */
  background: radial-gradient(ellipse at 50% 30%, #ffffff 0%, var(--color-bg-page) 50%, #eef1ef 100%);
  background-attachment: fixed;
  font-family: -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  color: var(--color-text-main);
}

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: var(--space-sm);
  position: relative;
}
/* 容器顶端竹青细线，呼应水墨纸边 */
.container::before {
  content: "";
  position: absolute;
  top: 0;
  left: var(--space-sm);
  right: var(--space-sm);
  height: 2px;
  background: linear-gradient(90deg, transparent 0%, var(--color-sub-bamboo) 30%, var(--color-sub-bamboo) 70%, transparent 100%);
  opacity: 0.6;
}

/* ===== 标题区 ===== */
h1 {
  font-size: 1.3em;
  margin: var(--space-sm) 0 var(--space-xs);
  word-break: break-all;
  color: var(--color-main-darkgreen);
  font-weight: 600;
  letter-spacing: 0.3px;
}
.team-slogan {
  font-size: 0.8em;
  color: var(--color-sub-bamboo);
  margin: 0 0 var(--space-sm);
  letter-spacing: 0.5px;
}
.disclaimer {
  font-size: 0.85em;
  color: var(--color-text-sub);
  margin: var(--space-sm) 0 var(--space-lg);
  padding-top: var(--space-sm);
  border-top: 1px solid var(--color-sub-bamboo);
}

/* ===== 卡片：输入区 / 结果区 ===== */
.card {
  background: var(--color-bg-card);
  border: 1px solid var(--color-border-card);
  border-radius: 8px;
  padding: var(--space-lg);
  margin-bottom: var(--space-lg);
  box-shadow: var(--shadow-card);
  /* 卡片微倾，呼应宣纸浮于案上的质感 */
  position: relative;
}

/* ===== 输入区 ===== */
section { margin-bottom: 0; }
.field-group {
  margin-bottom: var(--space-md);
  padding-bottom: var(--space-md);
  border-bottom: 1px solid var(--color-sub-bamboo);
}
.field-group:last-of-type {
  border-bottom: none;
  margin-bottom: 0;
  padding-bottom: 0;
}
.field-group-title {
  font-weight: bold;
  margin-bottom: var(--space-sm);
  color: var(--color-main-darkgreen);
  font-size: 0.98em;
}
.field-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-sm);
  margin-bottom: 6px;
}
.field-item {
  display: flex;
  align-items: center;
  flex: 1 1 auto;
  min-width: 140px;
}
.field-item label {
  min-width: 5em;
  font-size: 0.95em;
  color: var(--color-text-main);
}
.field-item input {
  width: 100%;
  min-width: 60px;
  padding: 8px 10px;
  font-size: 16px; /* 16px 防止 iOS 缩放 */
  border: 1px solid var(--color-border-card);
  border-radius: 4px;
  background: #fff;
  color: var(--color-text-main);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.field-item input:focus {
  outline: none;
  border-color: var(--color-sub-bamboo);
  box-shadow: 0 0 0 2px rgba(84, 124, 111, 0.15); /* focus ring，轻微 */
}

/* ===== 按钮组 ===== */
.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-sm);
  margin: var(--space-lg) 0 0;
}
button {
  padding: 12px 20px;
  font-size: 16px;
  min-height: 44px; /* 移动端点击区域 ≥44px */
  cursor: pointer;
  border: none;
  border-radius: 6px;
  background: var(--color-main-darkgreen);
  color: #fff;
  transition: background-color 0.15s;
}
button:hover:not(:disabled) {
  background: #1f3128; /* hover 简单加深，不加动画 */
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
  background: var(--color-main-darkgreen);
}

/* ===== 状态提示区 ===== */
.status-area {
  margin: var(--space-md) 0;
  padding: var(--space-sm) var(--space-sm) var(--space-sm) var(--space-md);
  min-height: 1.5em;
  font-size: 0.95em;
  border-left: 3px solid transparent; /* 默认透明，loading/error 时显色 */
  background: transparent;
}
.status-area.error {
  color: var(--color-error);
  border-left-color: var(--color-error);
  background: rgba(192, 57, 43, 0.04);
}
.status-area.loading {
  color: var(--color-sub-bamboo);
  border-left-color: var(--color-sub-bamboo);
  background: rgba(84, 124, 111, 0.04);
}

/* ===== 结果区 ===== */
.result-container {
  margin-top: var(--space-md);
  padding: 4px 0;
  border: none;
  white-space: pre-wrap;
  word-break: break-all;
  font-size: 0.95em;
}
.result-container:empty { display: none; }
.result-section {
  margin-bottom: var(--space-lg);
  padding-bottom: 10px;
  border-bottom: 1px solid var(--color-border-card);
}
.result-section:last-child {
  border-bottom: none;
  margin-bottom: 0;
  padding-bottom: 0;
}
.result-section-title {
  font-weight: bold;
  margin-bottom: 6px;
  color: var(--color-main-darkgreen);
  font-size: 0.96em;
  /* 竹青左边线，呼应水墨笔触 */
  border-left: 3px solid var(--color-sub-bamboo);
  padding-left: 8px;
}
.result-line { margin: 4px 0; color: var(--color-text-main); }
/* 仅【最大总积分】数字使用暗金高亮，页面唯一强调色 */
.result-section:first-child .result-line {
  color: var(--color-highlight-gold);
  font-weight: bold;
  font-size: 1.3em;
  margin-top: 2px;
}

/* ===== 页脚 ===== */
.footer {
  margin-top: var(--space-xl);
  padding-top: var(--space-md);
  border-top: 1px solid var(--color-sub-bamboo);
  text-align: center;
  font-size: 0.8em;
  color: var(--color-sub-bamboo);
  letter-spacing: 0.5px;
}

/* ===== 移动端适配 ===== */
@media (max-width: 480px) {
  body { padding: var(--space-xs); }
  .container { padding: var(--space-xs); }
  .card { padding: var(--space-md); }
  .field-item { min-width: 100%; }
  .field-item label { min-width: 6em; }
  button { flex: 1 1 auto; min-width: 120px; }
}
</style>
</head>
<body>
<div class="container">

  <!-- 标题与免责声明 -->
  <h1>偃武登封积分最大化计算器</h1>
  <div class="team-slogan">其徐如林 · 不动则已，动则成林</div>
  <div class="disclaimer">【本计算仅基于偃武登封游戏模型，游戏实际以游戏内为准】</div>

  <!-- 输入表单区 -->
  <div class="card">
  <section>
    <!-- 1/5 资源库存 -->
    <div class="field-group">
      <div class="field-group-title">【1/5】现有资源库存（单位：万）</div>
      <div class="field-row">
        <div class="field-item"><label>粮食</label><input type="number" id="grain_wan" min="0" step="any" inputmode="decimal"></div>
        <div class="field-item"><label>木材</label><input type="number" id="wood_wan" min="0" step="any" inputmode="decimal"></div>
      </div>
      <div class="field-row">
        <div class="field-item"><label>石头</label><input type="number" id="stone_wan" min="0" step="any" inputmode="decimal"></div>
        <div class="field-item"><label>铁</label><input type="number" id="iron_wan" min="0" step="any" inputmode="decimal"></div>
      </div>
    </div>

    <!-- 2/5 宝箱数量 -->
    <div class="field-group">
      <div class="field-group-title">【2/5】四类宝箱数量</div>
      <div class="field-row">
        <div class="field-item"><label>中品宝箱</label><input type="number" id="chest_mid" min="0" step="1" inputmode="numeric"></div>
        <div class="field-item"><label>良品宝箱</label><input type="number" id="chest_good" min="0" step="1" inputmode="numeric"></div>
      </div>
      <div class="field-row">
        <div class="field-item"><label>上品宝箱</label><input type="number" id="chest_high" min="0" step="1" inputmode="numeric"></div>
        <div class="field-item"><label>珍品宝箱</label><input type="number" id="chest_top" min="0" step="1" inputmode="numeric"></div>
      </div>
    </div>

    <!-- 3/5 马卷 -->
    <div class="field-group">
      <div class="field-group-title">【3/5】马卷数量</div>
      <div class="field-row">
        <div class="field-item"><label>马卷</label><input type="number" id="horse_ticket" min="0" step="1" inputmode="numeric"></div>
      </div>
    </div>

    <!-- 4/5 自有加速 -->
    <div class="field-group">
      <div class="field-group-title">【4/5】自有加速时长</div>
      <div class="field-row">
        <div class="field-item"><label>天</label><input type="number" id="day" min="0" step="1" inputmode="numeric"></div>
        <div class="field-item"><label>时</label><input type="number" id="hour" min="0" step="1" inputmode="numeric"></div>
        <div class="field-item"><label>分</label><input type="number" id="minute" min="0" step="1" inputmode="numeric"></div>
        <div class="field-item"><label>秒</label><input type="number" id="second" min="0" step="1" inputmode="numeric"></div>
      </div>
    </div>

    <!-- 5/5 铜币 -->
    <div class="field-group">
      <div class="field-group-title">【5/5】铜币数量</div>
      <div class="field-row">
        <div class="field-item"><label>铜币</label><input type="number" id="copper" min="0" step="1" inputmode="numeric"></div>
      </div>
    </div>

    <!-- 按钮组 -->
    <div class="button-row">
      <button type="button" id="btn_solve">①开始推演</button>
      <button type="button" id="btn_clear">②清空表单</button>
      <button type="button" id="btn_sample">③填充示例数据</button>
    </div>
  </section>
  </div>

  <!-- 状态提示区 -->
  <div class="status-area" id="status_area"></div>

  <!-- 结果输出区 -->
  <div class="card">
  <div class="result-container" id="result_container"></div>
  <div class="button-row" id="copy_row" style="display:none;">
    <button type="button" id="btn_copy">复制策略</button>
  </div>
  </div>

  <!-- 页脚 -->
  <div class="footer">其徐如林 | 不动则已，动则成林</div>

</div>

<script>
/*
 * 阶段A前端骨架 - 纯 Vanilla JS
 * 所有计算逻辑全部交给后端接口，前端不实现任何求解算法。
 * 接口：POST http://127.0.0.1:5000/api/solve
 *
 * 自测清单：
 *   自测1：填充8888示例，发起请求，页面渲染结果与后端接口返回data完全一致。
 *   自测2：输入负数，前端拦截，不发送请求。
 *   自测3：请求中按钮置灰，不可重复点击。
 *   自测4：400/408/500、网络异常都有友好文字提示。
 *   自测5：清空表单、复制策略功能正常。
 *   自测6：手机打开页面，表单不会溢出错乱。
 */

var API_URL = "http://127.0.0.1:5000/api/solve";

// 所有输入框 id 列表
var FIELD_IDS = [
  "grain_wan", "wood_wan", "stone_wan", "iron_wan",
  "chest_mid", "chest_good", "chest_high", "chest_top",
  "horse_ticket",
  "day", "hour", "minute", "second",
  "copper"
];

// 8888 示例数据
var SAMPLE_DATA = {
  grain_wan: 8888, wood_wan: 8888, stone_wan: 8888, iron_wan: 8888,
  chest_mid: 8888, chest_good: 8888, chest_high: 8888, chest_top: 8888,
  horse_ticket: 88,
  day: 888, hour: 0, minute: 0, second: 0,
  copper: 888888
};

// ===== DOM 引用 =====
var btnSolve = document.getElementById("btn_solve");
var btnClear = document.getElementById("btn_clear");
var btnSample = document.getElementById("btn_sample");
var btnCopy = document.getElementById("btn_copy");
var statusArea = document.getElementById("status_area");
var resultContainer = document.getElementById("result_container");
var copyRow = document.getElementById("copy_row");

// ===== 工具函数 =====
function $(id) { return document.getElementById(id); }

function showStatus(msg, type) {
  statusArea.textContent = msg || "";
  statusArea.className = "status-area" + (type ? " " + type : "");
}

function clearStatus() {
  statusArea.textContent = "";
  statusArea.className = "status-area";
}

function clearResult() {
  resultContainer.textContent = "";
  copyRow.style.display = "none";
}

// 收集表单数据
function collectForm() {
  var data = {};
  for (var i = 0; i < FIELD_IDS.length; i++) {
    var el = $(FIELD_IDS[i]);
    var val = (el.value || "").trim();
    if (val === "") {
      data[FIELD_IDS[i]] = 0;
    } else {
      data[FIELD_IDS[i]] = Number(val);
    }
  }
  return data;
}

// 前端输入校验：不能为负数
function validateInput(data) {
  for (var i = 0; i < FIELD_IDS.length; i++) {
    var key = FIELD_IDS[i];
    var v = data[key];
    if (typeof v !== "number" || isNaN(v)) {
      return "字段 " + key + " 不是合法数值";
    }
    if (v < 0) {
      return "字段 " + key + " 不能为负数: " + v;
    }
  }
  return null;
}

// 填充示例数据
function fillSample() {
  for (var key in SAMPLE_DATA) {
    if ($(key)) $(key).value = SAMPLE_DATA[key];
  }
  clearStatus();
  clearResult();
}

// 清空表单
function clearForm() {
  for (var i = 0; i < FIELD_IDS.length; i++) {
    $(FIELD_IDS[i]).value = "";
  }
  clearStatus();
  clearResult();
}

// ===== 结果渲染 =====
function fmtNum(n) {
  if (n === null || n === undefined) return "—";
  if (typeof n === "number") return n.toLocaleString("zh-CN");
  return String(n);
}

// HTML 转义，防止接口数据注入 XSS（TC19 安全检查）
// 仅作用于通过 innerHTML 拼接的动态字符串，不改变业务逻辑
function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function buildResultText(data) {
  // 生成纯文本策略摘要（供复制按钮使用）
  var lines = [];
  var r = data.result || {};
  var st = data.strategy || {};
  var res = data.resources || {};
  var conv = data.conversion || {};
  var sp = st["加速与铜币"] || data.speed_detail || {};

  lines.push("最大总积分：" + fmtNum(r["最大总积分"]));
  lines.push("训马次数：" + st["训马次数"] + " 次");
  lines.push("造兵：T3=" + st["T3组数"] + " 组；T4=" + st["T4组数"] + " 组；T5=" + st["T5组数"] + " 组");
  lines.push("");

  var ca = st["宝箱分配"] || {};
  for (var ct in ca) {
    if (!ca.hasOwnProperty(ct)) continue;
    var parts = [];
    var ck = ca[ct];
    for (var rk in ck) {
      if (!ck.hasOwnProperty(rk)) continue;
      if (ck[rk] > 0) parts.push(ck[rk] + rk);
    }
    if (parts.length > 0) {
      lines.push(ct + "宝箱：" + parts.join("，"));
    } else {
      lines.push(ct + "宝箱：未使用");
    }
  }
  lines.push("");

  lines.push("加速总需求：" + (sp["总需加速"] || "—"));
  lines.push("消耗铜币：" + fmtNum(sp["消耗铜币"]) + " 枚");
  lines.push("剩余铜币：" + fmtNum(sp["剩余铜币"]) + " 枚");
  lines.push("");

  lines.push("铁置换：耗铁 " + fmtNum(conv["耗铁总量"]) + "，置换得 粮" + fmtNum(conv["置换粮"]) + "、木" + fmtNum(conv["置换木"]) + "、石" + fmtNum(conv["置换石"]));
  lines.push("置换后剩余铁：" + fmtNum(conv["置换后剩余铁"]));
  lines.push("");

  var ra = res["剩余资源"] || {};
  lines.push("剩余资源：粮" + fmtNum(ra["粮"]) + "、木" + fmtNum(ra["木"]) + "、石" + fmtNum(ra["石"]) + "、铁" + fmtNum(ra["铁"]));

  return lines.join("\n");
}

function renderResult(data) {
  // 完整格式化渲染 data 到结果容器
  // 所有动态字符串均通过 esc() 转义后拼接到 innerHTML，防范 XSS（TC19）
  var html = "";

  var r = data.result || {};
  var st = data.strategy || {};
  var res = data.resources || {};
  var conv = data.conversion || {};
  // 兼容：加速明细可能在顶层 speed_detail 或 strategy.加速与铜币
  var sp = data.speed_detail || st["加速与铜币"] || {};

  // 总积分
  html += '<div class="result-section">';
  html += '<div class="result-section-title">最大总积分</div>';
  html += '<div class="result-line">' + esc(fmtNum(r["最大总积分"])) + '</div>';
  html += '</div>';

  // 策略
  html += '<div class="result-section">';
  html += '<div class="result-section-title">推演策略</div>';
  html += '<div class="result-line">训马：' + esc(st["训马次数"]) + ' 次</div>';
  html += '<div class="result-line">T3：' + esc(st["T3组数"]) + ' 组</div>';
  html += '<div class="result-line">T4：' + esc(st["T4组数"]) + ' 组</div>';
  html += '<div class="result-line">T5：' + esc(st["T5组数"]) + ' 组</div>';
  html += '</div>';

  // 宝箱分配（在 strategy 下）
  html += '<div class="result-section">';
  html += '<div class="result-section-title">宝箱分配</div>';
  var ca = st["宝箱分配"] || {};
  for (var ct in ca) {
    if (!ca.hasOwnProperty(ct)) continue;
    var parts = [];
    var ck = ca[ct];
    for (var rk in ck) {
      if (!ck.hasOwnProperty(rk)) continue;
      if (ck[rk] > 0) parts.push(esc(ck[rk]) + esc(rk));
    }
    if (parts.length === 0) parts.push("未使用");
    html += '<div class="result-line">' + esc(ct) + '：' + parts.join("，") + '</div>';
  }
  html += '</div>';

  // 加速明细
  html += '<div class="result-section">';
  html += '<div class="result-section-title">加速明细</div>';
  if (sp["总需加速"]) html += '<div class="result-line">总需加速：' + esc(sp["总需加速"]) + '</div>';
  if (sp["使用道具加速"]) html += '<div class="result-line">使用道具加速：' + esc(sp["使用道具加速"]) + '</div>';
  if (sp["铜币兑换加速"]) html += '<div class="result-line">铜币兑换加速：' + esc(sp["铜币兑换加速"]) + '</div>';
  if (sp["消耗铜币"] !== undefined) html += '<div class="result-line">消耗铜币：' + esc(fmtNum(sp["消耗铜币"])) + ' 枚</div>';
  if (sp["剩余铜币"] !== undefined) html += '<div class="result-line">剩余铜币：' + esc(fmtNum(sp["剩余铜币"])) + ' 枚</div>';
  html += '</div>';

  // 铁置换
  html += '<div class="result-section">';
  html += '<div class="result-section-title">铁置换明细</div>';
  html += '<div class="result-line">耗铁：' + esc(fmtNum(conv["耗铁总量"])) + '</div>';
  html += '<div class="result-line">置换得：粮' + esc(fmtNum(conv["置换粮"])) + '、木' + esc(fmtNum(conv["置换木"])) + '、石' + esc(fmtNum(conv["置换石"])) + '</div>';
  html += '<div class="result-line">剩余铁：' + esc(fmtNum(conv["置换后剩余铁"])) + '</div>';
  html += '</div>';

  // 剩余资源
  html += '<div class="result-section">';
  html += '<div class="result-section-title">剩余资源</div>';
  var ra = res["剩余资源"] || {};
  html += '<div class="result-line">粮食：' + esc(fmtNum(ra["粮"])) + '</div>';
  html += '<div class="result-line">木材：' + esc(fmtNum(ra["木"])) + '</div>';
  html += '<div class="result-line">石头：' + esc(fmtNum(ra["石"])) + '</div>';
  html += '<div class="result-line">铁：' + esc(fmtNum(ra["铁"])) + '</div>';
  html += '</div>';

  resultContainer.innerHTML = html;
  copyRow.style.display = "block";
}

// ===== 开始推演 =====
function solve() {
  // 收集数据
  var data = collectForm();
  // 前端校验：负数拦截（自测2）
  var errMsg = validateInput(data);
  if (errMsg) {
    showStatus(errMsg, "error");
    return;
  }

  // 按钮置灰，防重复点击（自测3）
  btnSolve.disabled = true;
  btnClear.disabled = true;
  btnSample.disabled = true;
  showStatus("正在推演，请稍候……", "loading");
  clearResult();

  // fetch POST 请求
  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  })
  .then(function(resp) {
    return resp.json().then(function(body) {
      return { status: resp.status, body: body };
    });
  })
  .then(function(out) {
    var body = out.body || {};
    var code = body.code;
    var msg = body.msg || "";
    var d = body.data;

    if (code === 200 && d) {
      // 成功：渲染结果（自测1）
      showStatus("推演完成", "");
      renderResult(d);
    } else if (code === 400) {
      // 参数错误（自测4）
      showStatus("参数错误：" + msg, "error");
    } else if (code === 408) {
      // 超时（自测4）
      showStatus("推演超时，输入规模过大，请降低数值再尝试", "error");
    } else if (code === 500) {
      // 服务器错误（自测4）
      showStatus("服务器内部错误：" + msg, "error");
    } else {
      // 其他未知
      showStatus("未知响应 code=" + code + "：" + msg, "error");
    }
  })
  .catch(function(err) {
    // 网络异常单独捕获（自测4）
    showStatus("网络异常，无法连接服务器：" + err.message, "error");
  })
  .then(function() {
    // 无论成功失败，恢复按钮
    btnSolve.disabled = false;
    btnClear.disabled = false;
    btnSample.disabled = false;
  });
}

// ===== 复制策略 =====
function copyStrategy() {
  var text = buildResultText(lastResultData);
  if (!text) {
    showStatus("无策略可复制", "error");
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      showStatus("策略已复制到剪贴板", "");
    }, function() {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

// 旧浏览器兼容复制
function fallbackCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand("copy");
    showStatus("策略已复制到剪贴板", "");
  } catch (e) {
    showStatus("复制失败：" + e.message, "error");
  }
  document.body.removeChild(ta);
}

// 缓存最近一次结果数据（供复制按钮读取）
var lastResultData = null;
var _origRenderResult = renderResult;
renderResult = function(data) {
  lastResultData = data;
  _origRenderResult(data);
};

// ===== 事件绑定 =====
btnSolve.addEventListener("click", solve);
btnClear.addEventListener("click", clearForm);
btnSample.addEventListener("click", fillSample);
btnCopy.addEventListener("click", copyStrategy);

// 输入框实时拦截负数（自测2增强：输入时提示）
for (var i = 0; i < FIELD_IDS.length; i++) {
  (function(id) {
    $(id).addEventListener("input", function() {
      var v = this.value;
      if (v !== "" && Number(v) < 0) {
        this.style.borderColor = "#c00";
        showStatus("字段 " + id + " 不能为负数", "error");
      } else {
        this.style.borderColor = "";
        if (statusArea.textContent.indexOf("不能为负数") >= 0) clearStatus();
      }
    });
  })(FIELD_IDS[i]);
}
</script>
</body>
</html>
